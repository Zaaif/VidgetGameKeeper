<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Game Keeper – wishlist overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Patrick+Hand&family=Inter:wght@400;600;800;900&family=Share+Tech+Mono&family=Bebas+Neue&display=block" rel="stylesheet">
<style>
  :root {
    --ink: #1b0e06;
    --ink-2: #3a200d;
    --cream: #fce6c6;
    --paper: #f9dcb3;
    --tape: #f1cf9f;
    --orange-hi: #ffd35e;
    --orange: #f7a51c;
    --orange-lo: #e0730a;
    --pink: #dc2a55;
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  [hidden] { display: none !important; }
  body.preview { background: #24242c repeating-conic-gradient(#2c2c36 0 25%, #22222a 0 50%) 0 0 / 48px 48px; }

  #stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    transform-origin: 0 0; font-family: 'Press Start 2P', monospace; color: var(--cream);
  }
  #fx { position: absolute; inset: 0; width: 1920px; height: 1080px; image-rendering: pixelated; pointer-events: none; z-index: 5; }

  /* ---------- alert ---------- */
  #alert { position: absolute; inset: 0; z-index: 4; }
  #alert[hidden] { display: none; }
  #alertBox { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .dim { position: absolute; inset: -270px -480px; opacity: 0;
    background: radial-gradient(closest-side, rgba(12,6,2,.62) 0%, rgba(12,6,2,.46) 42%, rgba(12,6,2,.2) 70%, rgba(12,6,2,.06) 88%, rgba(12,6,2,0) 100%); }
  .flash { position: absolute; inset: -140px -240px; opacity: 0; mix-blend-mode: screen;
    background: radial-gradient(closest-side, #fff4dc 0%, rgba(255,244,220,.7) 40%, rgba(255,244,220,.15) 80%, rgba(255,244,220,0) 100%); }
  .rays { position: absolute; left: 50%; top: 42%; width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px; opacity: 0; }
  .rays i { position: absolute; inset: 0; border-radius: 50%;
    background: repeating-conic-gradient(rgba(255,211,94,.22) 0 7.5deg, rgba(255,211,94,0) 7.5deg 15deg);
    -webkit-mask: radial-gradient(closest-side, #000 0%, rgba(0,0,0,.7) 30%, rgba(0,0,0,.25) 55%, transparent 72%);
            mask: radial-gradient(closest-side, #000 0%, rgba(0,0,0,.7) 30%, rgba(0,0,0,.25) 55%, transparent 72%); }
  .shaker { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .fit { display: flex; flex-direction: column; align-items: center; gap: 34px; flex: none; }

  .logo-wrap { width: 600px; }
  .logo { width: 100%; display: block; opacity: 0; filter: drop-shadow(0 14px 0 rgba(27,14,6,.35)); }

  .pxtext { position: relative; display: inline-block; white-space: nowrap; line-height: 1; opacity: 0; }
  .pxtext > span { display: block; }
  .pxtext .sh { position: absolute; left: 0; top: 0; color: var(--ink); }
  .pxtext .fill { position: relative; -webkit-background-clip: text; background-clip: text; color: transparent; }
  .headline { font-size: 110px; }
  .headline .fill { background-image: linear-gradient(180deg, var(--orange-hi) 0%, var(--orange) 48%, var(--orange-lo) 100%); }
  .counter { display: flex; align-items: flex-end; gap: 36px; opacity: 0; }
  .counter .pxtext { opacity: 1; }
  .num { font-size: 150px; }
  .num .fill { background-image: linear-gradient(180deg, #fffaf0 0%, #fde9c9 55%, #f6cf98 100%); }
  .unit { font-size: 54px; margin-bottom: 8px; }
  .unit .fill { background-image: linear-gradient(180deg, var(--orange-hi), var(--orange-lo)); }

  .tag { position: relative; opacity: 0; margin-top: 10px; padding: 16px 70px 26px; background: var(--paper); color: var(--ink);
    border: 6px solid var(--ink); border-radius: 18px 10px 24px 12px / 12px 22px 10px 18px;
    box-shadow: 0 12px 0 rgba(27,14,6,.35); font-family: 'Patrick Hand', cursive; font-size: 74px; letter-spacing: 2px; white-space: nowrap; }
  .tag .txt { position: relative; z-index: 1; }
  .tag .ul { position: absolute; left: 60px; right: 60px; bottom: 12px; height: 18px; width: calc(100% - 120px); overflow: visible; }
  .tag .dash { position: absolute; top: 50%; width: 46px; height: 60px; margin-top: -30px; overflow: visible; }
  .tag .dash.l { left: 12px; }
  .tag .dash.r { right: 12px; transform: scaleX(-1); }
  .tape { position: absolute; width: 120px; height: 40px; background: var(--tape); border: 5px solid var(--ink); border-radius: 4px; }
  .tape.tl { left: -44px; top: -22px; transform: rotate(-32deg); }
  .tape.br { right: -44px; bottom: -18px; transform: rotate(-32deg); }

  /* ---------- animacja zdobycia celu ---------- */
  #goalAlert { position: absolute; inset: 0; z-index: 4; }
  #goalBox { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .gdim { position: absolute; inset: -200px -400px; opacity: 0;
    background: radial-gradient(closest-side, rgba(6,26,12,.72) 0%, rgba(8,30,14,.45) 45%, rgba(8,30,14,0) 100%); }
  .gwrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .gcard { position: relative; display: flex; align-items: center; gap: 46px; opacity: 0;
    padding: 46px 70px; background: linear-gradient(160deg, #10281a 0%, #0a1a10 100%);
    border: 6px solid #6dff87; border-radius: 26px;
    box-shadow: 0 0 60px rgba(109,255,135,.35), inset 0 0 40px rgba(109,255,135,.12), 0 22px 0 rgba(0,0,0,.35); }
  .gcheck { position: relative; width: 190px; height: 190px; flex: none; border: 10px solid #6dff87; border-radius: 22px;
    background: rgba(109,255,135,.08); box-shadow: inset 0 0 24px rgba(109,255,135,.25); }
  .gcheck svg { position: absolute; inset: -18px; width: calc(100% + 36px); height: calc(100% + 36px); overflow: visible; }
  .gcheck path { stroke: #6dff87; stroke-width: 26; stroke-linecap: round; stroke-linejoin: round; fill: none;
    filter: drop-shadow(0 0 12px rgba(109,255,135,.8)); stroke-dasharray: 300; stroke-dashoffset: 300; }
  .gtexts { display: flex; flex-direction: column; gap: 14px; max-width: 1080px; }
  .glabel { font-size: 34px; letter-spacing: 6px; color: #6dff87; }
  .gnumber { font-size: 72px; color: #fff; text-shadow: 0 6px 0 #0c3b1c; white-space: nowrap; }
  .gnumber i { font-size: .45em; font-style: normal; color: #b8ffc9; margin-left: 14px; }
  .gdesc { font-size: 40px; line-height: 1.35; color: var(--cream); max-width: 1020px; }
  .gline { display: block; height: 8px; width: 0; margin-top: 12px; background: #6dff87; box-shadow: 0 0 14px rgba(109,255,135,.8); }
  .gstamp { position: absolute; right: -40px; top: -46px; padding: 12px 26px; opacity: 0;
    font-family: 'Patrick Hand', cursive; font-size: 54px; letter-spacing: 3px; color: #ff4d6d;
    border: 8px solid #ff4d6d; border-radius: 12px; transform: rotate(-14deg);
    box-shadow: 0 0 22px rgba(255,77,109,.5); background: rgba(30,8,14,.55); }
  .gflash { position: absolute; inset: -140px -240px; opacity: 0; mix-blend-mode: screen;
    background: radial-gradient(closest-side, rgba(180,255,200,.95) 0%, rgba(109,255,135,.5) 45%, transparent 100%); }

  /* ---------- widget ---------- */
  #widget { position: absolute; z-index: 3; display: flex; flex-direction: column; gap: 14px; }
  #widget[hidden] { display: none; }
  #widget.pos-top-left     { top: 44px; left: 44px;   transform-origin: top left; align-items: flex-start; }
  #widget.pos-top-right    { top: 44px; right: 44px;  transform-origin: top right; align-items: flex-end; }
  #widget.pos-bottom-left  { bottom: 44px; left: 44px;  transform-origin: bottom left; align-items: flex-start; }
  #widget.pos-bottom-right { bottom: 44px; right: 44px; transform-origin: bottom right; align-items: flex-end; }
  #widget.pos-top-center   { top: 44px; left: 50%; transform-origin: top center; align-items: center; }
  #widget.pos-bottom-center{ bottom: 44px; left: 50%; transform-origin: bottom center; align-items: center; }
  #widget.today-below { flex-direction: column; }
  #widget.today-above { flex-direction: column-reverse; }
  #widget.today-right { flex-direction: row; align-items: center; }
  #widget.today-left  { flex-direction: row-reverse; align-items: center; }
  /* stała ramka – treść przełącza się w środku, rozmiar się nie rusza.
     Wygląd sterują zmienne, a każdy styl podmienia tylko je. */
  #widget {
    --wbg: linear-gradient(180deg, rgba(37,20,9,.94), rgba(20,11,4,.94));
    --wborder: none;
    --wradius: 0;
    --wshadow: 0 -4px 0 0 var(--cream), 0 4px 0 0 var(--cream), -4px 0 0 0 var(--cream), 4px 0 0 0 var(--cream),
               0 -8px 0 0 var(--ink), 0 8px 0 0 var(--ink), -8px 0 0 0 var(--ink), 8px 0 0 0 var(--ink),
               0 16px 0 0 rgba(0,0,0,.35);
    --wfont: 'Press Start 2P', monospace;
    --wpad: 18px 24px 16px;
    --wtitle-color: var(--cream); --wtitle-size: 16px; --wtitle-space: 1px; --wtitle-weight: 400;
    --wcount-color: var(--orange); --wcount-size: 32px; --wcount-shadow: 0 4px 0 #6b3405; --wcount-weight: 400;
    --wsub-color: #c8ab86; --wsub-size: 16px;
    --wtrack: var(--ink-2); --wtrack-inset: inset 0 0 0 3px #4d2c12; --wtrack-h: 24px; --wtrack-radius: 0;
    --wseg-gap: 4px; --wseg-off: #5b3517; --wseg-radius: 0;
    --wfill: linear-gradient(180deg, var(--orange-hi), var(--orange) 50%, var(--orange-lo));
    --wblink: #ffe9a8;
    --wgnum-color: var(--orange); --wgnum-size: 26px; --wgnum-weight: 400;
    --wgtxt-color: #e6cfae; --wgtxt-size: 16px;
    --wdone: #6dff87; --wdone-2: #a9ffb8;
    --wtoday-bg: var(--pink); --wtoday-color: #fff; --wtoday-size: 16px;
    --wtoday-shadow: 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink), 0 10px 0 0 rgba(0,0,0,.3);
    --wtoday-radius: 0; --wdeco: none;
  }
  .wbox { position: relative; width: 640px; height: 140px; box-sizing: border-box; overflow: hidden;
    background: var(--wbg); border: var(--wborder); border-radius: var(--wradius); box-shadow: var(--wshadow); }
  .wbox::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: var(--wdeco); }
  .wbox[hidden] { display: none; }
  .wscreen { position: absolute; inset: 0; padding: var(--wpad); box-sizing: border-box;
    font-family: var(--wfont); opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .35s ease, visibility 0s linear .35s; }
  .wscreen.on { opacity: 1; visibility: visible; transition: opacity .35s ease .35s, visibility 0s linear 0s; }
  .wrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
  .wtitle { color: var(--wtitle-color); font-size: var(--wtitle-size); letter-spacing: var(--wtitle-space);
    font-weight: var(--wtitle-weight); padding-bottom: 8px; text-transform: uppercase; }
  .wcount { position: relative; color: var(--wcount-color); font-size: var(--wcount-size);
    font-weight: var(--wcount-weight); text-shadow: var(--wcount-shadow); line-height: 1; }
  .wbar { display: flex; gap: var(--wseg-gap); height: var(--wtrack-h); margin: 12px 0 10px; padding: 4px;
    background: var(--wtrack); box-shadow: var(--wtrack-inset); border-radius: var(--wtrack-radius); box-sizing: border-box; }
  .wbar i { flex: 1; background: var(--wseg-off); border-radius: var(--wseg-radius); }
  .wbar i.on { background: var(--wfill); }
  .wbar i.edge { animation: blink 10s steps(1, end) infinite; }
  @keyframes blink { 0%, 95% { background: var(--wseg-off); } 96%, 98% { background: var(--wblink); } 99% { background: var(--wseg-off); } }
  .wsub { color: var(--wsub-color); font-size: var(--wsub-size); }
  .wsub b { color: var(--wtitle-color); font-weight: inherit; }
  .wgoal { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    text-align: center; overflow: hidden; }
  .wgoal .gn { color: var(--wgnum-color); font-size: var(--wgnum-size); font-weight: var(--wgnum-weight); text-shadow: var(--wcount-shadow); }
  .wgoal .gt { color: var(--wgtxt-color); font-size: var(--wgtxt-size); line-height: 1.5; }
  .wgoal.done .gn { color: var(--wdone); text-shadow: none; }
  .wgoal.done .gt { color: var(--wdone-2); }

  /* ---------- style ramki ---------- */
  #widget.s-modern {
    --wbg: linear-gradient(145deg, rgba(20,25,33,.96), rgba(12,15,20,.96));
    --wborder: 1px solid rgba(255,255,255,.12); --wradius: 16px;
    --wshadow: 0 18px 40px rgba(0,0,0,.45);
    --wfont: 'Inter', system-ui, sans-serif; --wpad: 20px 26px 18px;
    --wtitle-color: #93a1b5; --wtitle-size: 13px; --wtitle-space: 3px; --wtitle-weight: 600;
    --wcount-color: #fff; --wcount-size: 40px; --wcount-weight: 800; --wcount-shadow: none;
    --wsub-color: #8492a6; --wsub-size: 14px;
    --wtrack: rgba(255,255,255,.07); --wtrack-inset: none; --wtrack-h: 12px; --wtrack-radius: 99px;
    --wseg-gap: 0px; --wseg-off: transparent; --wseg-radius: 0;
    --wfill: linear-gradient(90deg, #ffb43a, #ff7a18); --wblink: #ffe0a8;
    --wgnum-color: #ffb43a; --wgnum-size: 30px; --wgnum-weight: 800;
    --wgtxt-color: #dbe3ee; --wgtxt-size: 16px;
    --wtoday-bg: rgba(255,255,255,.08); --wtoday-color: #fff; --wtoday-size: 13px; --wtoday-radius: 99px;
    --wtoday-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
    --wdeco: linear-gradient(90deg, rgba(255,180,58,.9) 0 4px, transparent 4px);
  }
  #widget.s-glass {
    --wbg: rgba(255,255,255,.1); --wborder: 1px solid rgba(255,255,255,.3); --wradius: 20px;
    --wshadow: 0 16px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.4);
    --wfont: 'Inter', system-ui, sans-serif; --wpad: 20px 26px 18px;
    --wtitle-color: rgba(255,255,255,.75); --wtitle-size: 13px; --wtitle-space: 3px; --wtitle-weight: 600;
    --wcount-color: #fff; --wcount-size: 40px; --wcount-weight: 800; --wcount-shadow: 0 2px 12px rgba(0,0,0,.4);
    --wsub-color: rgba(255,255,255,.7); --wsub-size: 14px;
    --wtrack: rgba(255,255,255,.18); --wtrack-inset: none; --wtrack-h: 10px; --wtrack-radius: 99px;
    --wseg-gap: 0px; --wseg-off: transparent;
    --wfill: linear-gradient(90deg, #fff, rgba(255,255,255,.75)); --wblink: #fff;
    --wgnum-color: #fff; --wgnum-size: 30px; --wgnum-weight: 800;
    --wgtxt-color: rgba(255,255,255,.85); --wgtxt-size: 16px;
    --wtoday-bg: rgba(255,255,255,.18); --wtoday-color: #fff; --wtoday-size: 13px; --wtoday-radius: 99px; --wtoday-shadow: none;
  }
  #widget.s-neon {
    --wbg: #07060d; --wborder: 2px solid #ff2e88; --wradius: 8px;
    --wshadow: 0 0 18px rgba(255,46,136,.55), inset 0 0 26px rgba(255,46,136,.16);
    --wfont: 'Share Tech Mono', monospace; --wpad: 18px 24px 16px;
    --wtitle-color: #4df0ff; --wtitle-size: 16px; --wtitle-space: 4px;
    --wcount-color: #ff2e88; --wcount-size: 42px; --wcount-shadow: 0 0 14px rgba(255,46,136,.8);
    --wsub-color: #9ad9e6; --wsub-size: 15px;
    --wtrack: #120b1c; --wtrack-inset: inset 0 0 0 1px rgba(77,240,255,.35); --wtrack-h: 16px; --wtrack-radius: 2px;
    --wseg-gap: 3px; --wseg-off: #1d1430;
    --wfill: linear-gradient(90deg, #4df0ff, #ff2e88); --wblink: #fff;
    --wgnum-color: #4df0ff; --wgnum-size: 30px; --wgtxt-color: #ffd7ec; --wgtxt-size: 16px;
    --wdone: #7dff9a; --wdone-2: #b9ffc8;
    --wtoday-bg: #ff2e88; --wtoday-color: #fff; --wtoday-size: 14px; --wtoday-radius: 4px;
    --wtoday-shadow: 0 0 12px rgba(255,46,136,.7);
  }
  #widget.s-minimal {
    --wbg: transparent; --wborder: none; --wradius: 0; --wshadow: none;
    --wfont: 'Inter', system-ui, sans-serif; --wpad: 14px 8px;
    --wtitle-color: rgba(255,255,255,.8); --wtitle-size: 14px; --wtitle-space: 4px; --wtitle-weight: 600;
    --wcount-color: #fff; --wcount-size: 46px; --wcount-weight: 900; --wcount-shadow: 0 3px 10px rgba(0,0,0,.85);
    --wsub-color: rgba(255,255,255,.75); --wsub-size: 15px;
    --wtrack: rgba(0,0,0,.45); --wtrack-inset: none; --wtrack-h: 8px; --wtrack-radius: 99px;
    --wseg-gap: 0px; --wseg-off: transparent; --wfill: #fff; --wblink: #ffe9a8;
    --wgnum-color: #fff; --wgnum-size: 32px; --wgnum-weight: 900; --wgtxt-color: rgba(255,255,255,.9); --wgtxt-size: 17px;
    --wtoday-bg: rgba(0,0,0,.5); --wtoday-color: #fff; --wtoday-size: 14px; --wtoday-radius: 99px; --wtoday-shadow: none;
  }
  #widget.s-paper {
    --wbg: var(--paper); --wborder: 6px solid var(--ink); --wradius: 18px 10px 24px 12px / 12px 22px 10px 18px;
    --wshadow: 0 12px 0 rgba(27,14,6,.35);
    --wfont: 'Patrick Hand', cursive; --wpad: 14px 28px;
    --wtitle-color: var(--ink); --wtitle-size: 24px; --wtitle-space: 1px;
    --wcount-color: var(--ink); --wcount-size: 44px; --wcount-shadow: none;
    --wsub-color: #6b4a2a; --wsub-size: 22px;
    --wtrack: #e3c497; --wtrack-inset: inset 0 0 0 3px var(--ink); --wtrack-h: 22px; --wtrack-radius: 6px;
    --wseg-gap: 3px; --wseg-off: #d3ae7d;
    --wfill: linear-gradient(180deg, var(--orange-hi), var(--orange-lo)); --wblink: #fff3cf;
    --wgnum-color: var(--pink); --wgnum-size: 34px; --wgtxt-color: var(--ink); --wgtxt-size: 24px;
    --wdone: #1d7a35; --wdone-2: #245e2f;
    --wtoday-bg: var(--tape); --wtoday-color: var(--ink); --wtoday-size: 20px; --wtoday-radius: 4px;
    --wtoday-shadow: 0 0 0 4px var(--ink);
  }
  #widget.s-arcade {
    --wbg: linear-gradient(180deg, #16215a, #0b1038); --wborder: 6px solid #ffcf3f; --wradius: 6px;
    --wshadow: inset 0 0 0 4px #24317a, 0 12px 0 rgba(0,0,0,.4);
    --wfont: 'Press Start 2P', monospace; --wpad: 16px 22px 14px;
    --wtitle-color: #9ecbff; --wtitle-size: 14px; --wtitle-space: 1px;
    --wcount-color: #ffcf3f; --wcount-size: 32px; --wcount-shadow: 0 4px 0 #b3790a;
    --wsub-color: #8fb7ee; --wsub-size: 14px;
    --wtrack: #0a0f30; --wtrack-inset: inset 0 0 0 3px #2b3a8f; --wtrack-h: 22px;
    --wseg-gap: 4px; --wseg-off: #23307d;
    --wfill: linear-gradient(180deg, #ff4d6d, #c2185b); --wblink: #fff;
    --wgnum-color: #ffcf3f; --wgnum-size: 26px; --wgtxt-color: #cfe2ff; --wgtxt-size: 15px;
    --wtoday-bg: #ff4d6d; --wtoday-color: #fff; --wtoday-size: 14px; --wtoday-radius: 4px;
    --wtoday-shadow: 0 0 0 4px #0b1038;
    --wdeco: radial-gradient(circle at 12px 12px, #ffcf3f 3px, transparent 4px),
             radial-gradient(circle at calc(100% - 12px) 12px, #ffcf3f 3px, transparent 4px),
             radial-gradient(circle at 12px calc(100% - 12px), #ffcf3f 3px, transparent 4px),
             radial-gradient(circle at calc(100% - 12px) calc(100% - 12px), #ffcf3f 3px, transparent 4px);
  }
  #widget.s-terminal {
    --wbg: rgba(2,14,4,.9); --wborder: 2px solid #33ff66; --wradius: 4px;
    --wshadow: 0 0 18px rgba(51,255,102,.25), inset 0 0 30px rgba(51,255,102,.08);
    --wfont: 'Share Tech Mono', monospace; --wpad: 16px 22px 14px;
    --wtitle-color: #7cffa6; --wtitle-size: 16px; --wtitle-space: 3px;
    --wcount-color: #33ff66; --wcount-size: 42px; --wcount-shadow: 0 0 12px rgba(51,255,102,.7);
    --wsub-color: #62c47f; --wsub-size: 15px;
    --wtrack: #04210c; --wtrack-inset: inset 0 0 0 1px #1c6b33; --wtrack-h: 18px; --wtrack-radius: 2px;
    --wseg-gap: 3px; --wseg-off: #0c3d1a; --wfill: #33ff66; --wblink: #d9ffe4;
    --wgnum-color: #33ff66; --wgnum-size: 30px; --wgtxt-color: #a8ffc2; --wgtxt-size: 16px;
    --wdone: #eaff7c; --wdone-2: #f4ffbe;
    --wtoday-bg: #0c3d1a; --wtoday-color: #7cffa6; --wtoday-size: 14px; --wtoday-radius: 2px;
    --wtoday-shadow: inset 0 0 0 1px #33ff66;
    --wdeco: repeating-linear-gradient(180deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px);
  }
  #widget.s-sunset {
    --wbg: linear-gradient(135deg, #ff8a2b 0%, #ff4d6d 45%, #8f2d9e 100%);
    --wborder: none; --wradius: 22px; --wshadow: 0 18px 40px rgba(143,45,158,.45);
    --wfont: 'Inter', system-ui, sans-serif; --wpad: 20px 26px 18px;
    --wtitle-color: rgba(255,255,255,.85); --wtitle-size: 13px; --wtitle-space: 3px; --wtitle-weight: 700;

<script>
// bez pamięci podręcznej – inaczej OBS i telefon trzymają starą wersję do 10 minut
document.write('<scr' + 'ipt src="common.js?v=' + Date.now() + '"></scr' + 'ipt>');

<script>
'use strict';
const VERSION = '1.1.0-2026-09-20';
const P = WL.readParams();
const $ = (id) => document.getElementById(id);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
if (P.preview) document.body.classList.add('preview');

// ---------- skalowanie sceny 1920×1080 do rozmiaru źródła ----------
function fitStage() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $('stage').style.transform = `scale(${s})`;
}
addEventListener('resize', fitStage);
fitStage();

// ---------- stan ----------
const KEY_STATE = `wl.state.${P.topic}`;
const KEY_CFG = `wl.cfg.${P.topic}`;
const savedCfg = WL.store.get(KEY_CFG, null);
let cfg = WL.normalizeConfig(savedCfg && savedCfg.cfg);
let cfgTime = (savedCfg && savedCfg.time) || 0;
const S = Object.assign({
  raw: null, rawTime: 0, today: null, yesterday: null,
  lastCelebrated: null, pending: null, pendingFrom: null,
  lastPlayed: null, streamStartedAt: null, goalsDone: [], pendingGoals: [],
}, WL.store.get(KEY_STATE, {}));
if (!Array.isArray(S.goalsDone)) S.goalsDone = [];
if (!Array.isArray(S.pendingGoals)) S.pendingGoals = [];
let playing = false;
let streamKnown = false;
let streaming = false;
const inOBS = !!window.obsstudio;

function saveState() { WL.store.set(KEY_STATE, S); }
function saveCfg() { WL.store.set(KEY_CFG, { cfg, time: cfgTime }); }
function total() { return S.raw == null ? null : S.raw + cfg.offset; }

// ---------- progi ----------
function evaluate() {
  const t = total();
  if (t == null) return;
  const tier = WL.tierOf(t, cfg.step);
  if (S.lastCelebrated == null) {
    // pierwsze uruchomienie: bieżący próg i zdobyte już cele uznajemy za zaliczone
    S.lastCelebrated = tier;
    evaluateGoals(true);
    saveState();
    return;
  }
  evaluateGoals(false);
  if (tier > S.lastCelebrated && (S.pending == null || tier > S.pending)) {
    if (S.pending == null) S.pendingFrom = S.lastCelebrated;
    S.pending = tier;
    saveState();
    publishStatusSoon();
  }
}

// Cele: zdobycie nowego celu trafia do kolejki. `silent` oznacza, że cel już był
// zdobyty wcześniej (np. świeżo dopisany w panelu) i nie należy go świętować.
function evaluateGoals(silent) {
  const t = total();
  if (t == null) return;
  for (const g of cfg.goals || []) {
    if (t < g.n) continue;
    if (S.goalsDone.includes(g.n) || S.pendingGoals.some((p) => p.n === g.n)) continue;
    if (silent || !cfg.goalAlertEnabled) S.goalsDone.push(g.n);
    else S.pendingGoals.push({ n: g.n, text: g.text });
  }
  saveState();
}

function playGoalNext() {
  if (!S.pendingGoals.length || playing) return;
  const g = S.pendingGoals.shift();
  if (!S.goalsDone.includes(g.n)) S.goalsDone.push(g.n);
  saveState();
  playGoalAlert(g);
}

// Zmiana progu/korekty nie powinna odpalać animacji za coś, co już było.
function rebaseline() {
  const t = total();
  if (t == null || S.lastCelebrated == null || S.pending != null) return;
  S.lastCelebrated = Math.max(S.lastCelebrated, WL.tierOf(t, cfg.step));
  saveState();
}

function gate() {
  if (!cfg.alertsEnabled) return { ok: false, code: 'paused', text: 'Animacje wstrzymane w panelu' };
  if (!cfg.requireStream) return { ok: true, code: 'ok', text: 'Gotowe (bez wymogu streama)' };
  if (!streamKnown) {
    return inOBS
      ? { ok: false, code: 'noperm', text: 'Brak dostępu do statusu OBS – ustaw uprawnienia strony w źródle' }
      : { ok: false, code: 'noobs', text: 'Overlay działa poza OBS – nie wiem, czy jest stream' };
  }
  if (!streaming) return { ok: false, code: 'offline', text: 'Stream offline' };
  const readyAt = S.streamStartedAt + cfg.minUptimeMin * 60000;
  if (Date.now() < readyAt) return { ok: false, code: 'uptime', readyAt, text: `Czekam, aż stream potrwa ${cfg.minUptimeMin} min` };
  return { ok: true, code: 'ok', text: 'Gotowe' };
}

let lastGateCode = null;
function tick() {
  const g = gate();
  if (g.code !== lastGateCode) {
    lastGateCode = g.code;
    if (S.pending != null) publishStatusSoon();
  }
  // ten sam numer jako próg i jako cel = jedna animacja, ta od celu
  if (S.pending != null && S.pendingGoals.some((x) => x.n === S.pending)) {
    S.lastCelebrated = Math.max(S.lastCelebrated ?? S.pending, S.pending);
    S.pending = null;
    S.pendingFrom = null;
    saveState();
  }
  if (!playing && g.ok) {
    if (S.pending != null) playPending();
    else if (S.pendingGoals.length) playGoalNext();
  }
  renderInfo();
}

function playPending() {
  if (S.pending == null || playing) return;
  const tier = S.pending;
  const from = S.pendingFrom != null ? S.pendingFrom : tier - cfg.step;
  // oznaczamy od razu, żeby odświeżenie źródła w trakcie nie puściło animacji drugi raz
  S.lastCelebrated = Math.max(S.lastCelebrated ?? tier, tier);
  S.pending = null;
  S.pendingFrom = null;
  S.lastPlayed = { tier, from, at: Date.now() };
  saveState();
  playAlert(tier, from);
}

// ---------- status streama z OBS ----------
function setStreaming(on, source) {
  streamKnown = true;
  if (on && !streaming) {
    const stale = !S.streamStartedAt || Date.now() - S.streamStartedAt > 18 * 3600e3;
    if (source === 'event' || stale) S.streamStartedAt = Date.now();
  }
  if (!on) S.streamStartedAt = null;
  if (on !== streaming) { streaming = on; saveState(); publishStatusSoon(); }
}
if (inOBS) {
  addEventListener('obsStreamingStarted', () => setStreaming(true, 'event'));
  addEventListener('obsStreamingStopped', () => setStreaming(false, 'event'));
  const pollObs = () => {
    try { window.obsstudio.getStatus && window.obsstudio.getStatus((s) => s && setStreaming(!!s.streaming, 'poll')); } catch (e) {}
  };
  pollObs();
  setInterval(pollObs, 20000);
} else if (P.preview) {
  // podgląd w przeglądarce: udajemy, że stream trwa od otwarcia strony
  streamKnown = true;
  streaming = true;
  S.streamStartedAt = Date.now();
}

// ---------- widget ----------
const SEGMENTS = 20;
const wBar = $('wBar');
for (let i = 0; i < SEGMENTS; i++) wBar.appendChild(document.createElement('i'));
let shownTotal = null;
let countAnim = null;

function renderWidget() {
  const w = $('widget');
  const t = total();
  const todayTxt = todayText();
  const goals = cfg.goals || [];
  const showFrame = (cfg.showBar || goals.length > 0) && t != null;
  const showToday = cfg.showToday && !!todayTxt;
  w.hidden = !(showFrame || showToday || cfg.showSteamTag);
  w.className = `pos-${cfg.widgetPos} today-${cfg.todayPos} s-${cfg.widgetStyle}`;
  // dokładna pozycja: margines od wybranego rogu plus przesunięcie z panelu
  const M = 44, st = w.style;
  st.left = st.right = st.top = st.bottom = st.marginLeft = '';
  if (cfg.widgetPos.includes('left')) st.left = M + cfg.widgetX + 'px';
  else if (cfg.widgetPos.includes('right')) st.right = M - cfg.widgetX + 'px';
  else { st.left = '50%'; st.marginLeft = cfg.widgetX + 'px'; }
  if (cfg.widgetPos.startsWith('top')) st.top = M + cfg.widgetY + 'px';
  else st.bottom = M - cfg.widgetY + 'px';
  const center = cfg.widgetPos.endsWith('center') ? 'translateX(-50%) ' : '';
  w.style.transform = `${center}scale(${cfg.widgetScale})`;
  $('wbox').hidden = !showFrame;
  $('wToday').hidden = !showToday;
  $('wToday').textContent = todayTxt || '';
  const showSteam = cfg.showSteamTag && !!cfg.steamTagText.trim();
  $('wSteam').hidden = !showSteam;
  $('wSteam').textContent = cfg.steamTagText;
  $('wFoot').style.display = (showToday || showSteam) ? '' : 'none';
  $('wFoot').style.width = showFrame ? '640px' : 'auto';
  $('wTitle').textContent = cfg.widgetTitle;
  if (t == null) return;

  // pasek: albo do następnego progu, albo do najbliższego celu
  let prev = WL.tierOf(t, cfg.step);
  let next = prev + cfg.step;
  if (cfg.barToGoal && goals.length) {
    const ns = goals.map((g) => g.n).sort((a, b) => a - b);
    const after = ns.find((n) => n > t);
    if (after != null) {
      next = after;
      prev = ns.filter((n) => n <= t).pop() || 0;
    }
  }
  const span = Math.max(1, next - prev);
  const filled = Math.floor(((t - prev) / span) * SEGMENTS);
  Array.from(wBar.children).forEach((el, i) => {
    el.className = i < filled ? 'on' : i === filled ? 'edge' : '';
  });
  $('wNext').textContent = WL.fmt(next);
  $('wLeft').textContent = WL.fmt(next - t);

  // pasek i cele przełączają się w stałej ramce
  const key = JSON.stringify(goals) + `|${cfg.barSeconds}|${cfg.goalSeconds}|${cfg.showBar}`;
  if (key !== cycleKey) { cycleKey = key; goalIdx = 0; restartCycle(); }
  else if (screenMode === 'goal') paintGoal(goalIdx);   // odśwież kolor „zdobyte”

  if (shownTotal == null) { shownTotal = t; $('wCount').textContent = WL.fmt(t); return; }
  if (t !== shownTotal) animateCount(shownTotal, t);
}

function animateCount(a, b) {
  if (countAnim) cancelAnimationFrame(countAnim);
  if (b > a) floater('+' + WL.fmt(b - a));
  const t0 = performance.now();
  const step = (now) => {
    const p = Math.min(1, (now - t0) / 900);
    const v = Math.round(a + (b - a) * (1 - Math.pow(1 - p, 3)));
    $('wCount').textContent = WL.fmt(v);
    shownTotal = v;
    countAnim = p < 1 ? requestAnimationFrame(step) : null;
  };
  countAnim = requestAnimationFrame(step);
}

function floater(text) {
  const f = document.createElement('div');
  f.className = 'floater';
  f.textContent = text;
  $('wCount').appendChild(f);
  f.animate([{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(-60px)', opacity: 0 }],
    { duration: 1600, easing: 'steps(12, end)' }).onfinish = () => f.remove();
}

// ---------- przełączanie treści w stałej ramce ----------
let goalIdx = 0, cycleTimer = null, cycleKey = null, screenMode = 'bar';

// opis celu zmniejszamy tak, żeby zmieścił się w ramce – ramka nigdy nie zmienia rozmiaru
function fitGoalText() {
  const el = $('wGoal'), t = el.querySelector('.gt');
  t.style.fontSize = '';
  const base = Math.round(parseFloat(getComputedStyle(t).fontSize)) || 16;
  for (let size = base; size >= 9; size--) {
    t.style.fontSize = size + 'px';
    if (el.scrollHeight <= el.clientHeight) break;
  }
}
function paintGoal(i) {
  const goals = cfg.goals || [];
  if (!goals.length) return;
  goalIdx = ((i % goals.length) + goals.length) % goals.length;
  const g = goals[goalIdx], el = $('wGoal'), t = total();
  const done = t != null && t >= g.n;
  el.classList.toggle('done', done);
  el.querySelector('.gn').textContent = (done ? '✔ ' : '') + WL.fmt(g.n);
  el.querySelector('.gt').textContent = (g.text || '').toUpperCase();
  fitGoalText();
}
function showScreen(mode) {
  screenMode = mode;
  $('wScreenBar').classList.toggle('on', mode === 'bar');
  $('wGoal').classList.toggle('on', mode === 'goal');
}
function restartCycle() {
  clearTimeout(cycleTimer);
  cycleTimer = null;
  const goals = cfg.goals || [];
  if (!goals.length) { showScreen('bar'); return; }
  if (!cfg.showBar) {
    paintGoal(goalIdx);
    showScreen('goal');
    if (goals.length > 1) cycleTimer = setTimeout(stepCycle, cfg.goalSeconds * 1000);
    return;
  }
  showScreen('bar');
  cycleTimer = setTimeout(stepCycle, cfg.barSeconds * 1000);
}
function stepCycle() {
  const goals = cfg.goals || [];
  if (!goals.length) { showScreen('bar'); return; }
  if (screenMode === 'bar') {
    paintGoal(goalIdx);
    showScreen('goal');
    cycleTimer = setTimeout(stepCycle, cfg.goalSeconds * 1000);
  } else if (cfg.showBar) {
    goalIdx += 1;
    showScreen('bar');
    cycleTimer = setTimeout(stepCycle, cfg.barSeconds * 1000);
  } else {
    // same cele: przenikanie między kolejnymi
    const el = $('wGoal');
    el.classList.remove('on');
    setTimeout(() => { paintGoal(goalIdx + 1); el.classList.add('on'); }, 450);
    cycleTimer = setTimeout(stepCycle, cfg.goalSeconds * 1000);
  }
}

// ---------- dźwięk (WebAudio, chiptune) ----------
const Sfx = (() => {
  let ctx = null, master = null, noiseBuf = null;
  const NOTE = { C5: 523.25, E5: 659.25, G5: 783.99, B5: 987.77, C6: 1046.5, E6: 1318.5, G6: 1568, C7: 2093 };
  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      master = ctx.createGain();
      master.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
    master.gain.value = cfg.volume * 0.55;
    return true;
  }
  function tone(f, t, d, { type = 'square', v = 0.25, f2 = null } = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + 0.005);
    g.gain.setValueAtTime(v, t + d * 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(master);
    o.start(t);
    o.stop(t + d + 0.03);
  }
  function noise(t, d, { v = 0.25, freq = 1200, q = 0.7, type = 'bandpass' } = {}) {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf;
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f).connect(g).connect(master);
    s.start(t);
    s.stop(t + d + 0.03);
  }
  const now = () => ctx.currentTime + 0.01;
  return {
    ensure,
    intro() {
      if (!ensure()) return;
      const t = now();
      ['C5', 'E5', 'G5', 'C6', 'E6', 'G6'].forEach((n, i) => tone(NOTE[n], t + i * 0.055, 0.09, { v: 0.16 }));
      noise(t, 0.5, { v: 0.12, freq: 3000, type: 'highpass' });
    },
    thud() {
      if (!ensure()) return;
      const t = now();
      tone(160, t, 0.22, { v: 0.4, f2: 40 });
      noise(t, 0.18, { v: 0.3, freq: 400, type: 'lowpass' });
    },
    slam() {
      if (!ensure()) return;
      const t = now();
      tone(330, t, 0.3, { v: 0.32, f2: 55 });
      tone(165, t, 0.3, { type: 'triangle', v: 0.4, f2: 40 });
      noise(t, 0.35, { v: 0.35, freq: 900 });
    },
    tick(p) {
      if (!ensure()) return;
      tone(700 + 900 * p, now(), 0.04, { v: 0.09 });
    },
    fanfare() {
      if (!ensure()) return;
      const t = now();
      tone(NOTE.B5, t, 0.07, { v: 0.2 });
      tone(NOTE.E6, t + 0.07, 0.35, { v: 0.2 });
      ['C5', 'E5', 'G5', 'C6', 'E6', 'G6', 'C7'].forEach((n, i) => tone(NOTE[n], t + 0.12 + i * 0.05, 0.12, { v: 0.12 }));
      const t2 = t + 0.5;
      ['C6', 'E6', 'G6'].forEach((n) => tone(NOTE[n], t2, 1.1, { type: 'triangle', v: 0.14 }));
      tone(NOTE.C5, t2, 0.9, { v: 0.1 });
      noise(t, 0.7, { v: 0.28, freq: 5000, type: 'highpass' });
    },
    exit() {
      if (!ensure()) return;
      const t = now();
      ['G6', 'E6', 'C6', 'G5'].forEach((n, i) => tone(NOTE[n], t + i * 0.06, 0.08, { v: 0.1 }));
    },
    // cel: miękki dzwonek zamiast monet
    ding() {
      if (!ensure()) return;
      const t = now();
      tone(880, t, 0.5, { type: 'triangle', v: 0.22 });
      tone(1320, t + 0.02, 0.6, { type: 'sine', v: 0.16 });
    },
    stamp() {
      if (!ensure()) return;
      const t = now();
      tone(110, t, 0.28, { type: 'sine', v: 0.45, f2: 45 });
      noise(t, 0.22, { v: 0.32, freq: 700, type: 'lowpass' });
    },
    goalDone() {
      if (!ensure()) return;
      const t = now();
      ['C5', 'E5', 'G5', 'B5', 'C6', 'E6'].forEach((n, i) => tone(NOTE[n], t + i * 0.085, 0.5, { type: 'triangle', v: 0.16 }));
      tone(NOTE.C6, t + 0.6, 1.3, { type: 'sine', v: 0.12 });
      tone(NOTE.G5, t + 0.6, 1.3, { type: 'triangle', v: 0.1 });
      noise(t + 0.55, 1.1, { v: 0.14, freq: 7000, type: 'highpass' });
    },
  };
})();

// ---------- cząsteczki (canvas w niskiej rozdzielczości skalowany w górę = prawdziwe piksele) ----------
const FX = (() => {
  const cv = $('fx'), g = cv.getContext('2d');
  let W = 480, H = 270;
  let px = 4;                                   // ile pikseli ekranu ma jeden piksel cząsteczki
  let area = { x0: 0, y0: 0, x1: W, y1: H };    // obszar animacji w jednostkach canvasa
  g.imageSmoothingEnabled = false;
  const parts = [];
  let rainUntil = 0, raf = null, last = 0, rainAcc = 0;

  const coinFrames = [9, 7, 5, 3, 1, 3, 5, 7].map((w) => {
    const c = document.createElement('canvas');
    c.width = 9; c.height = 9;
    const x = c.getContext('2d');
    const off = (9 - w) / 2;
    for (let yy = 0; yy < 9; yy++) {
      for (let xx = 0; xx < w; xx++) {
        const nx = (xx + 0.5 - w / 2) / (w / 2), ny = (yy + 0.5 - 4.5) / 4.5;
        const d = nx * nx + ny * ny;
        if (w > 1 && d > 1.05) continue;
        x.fillStyle = d > 0.6 || w === 1 ? '#8a4b06' : d > 0.28 ? '#f7a51c' : '#ffd35e';
        if (w >= 5 && xx === Math.floor(w / 2) - 1 && yy === 2) x.fillStyle = '#fff3b0';
        x.fillRect(off + xx, yy, 1, 1);
      }
    }
    return c;
  });
  const COLORS = ['#ffd35e', '#f7a51c', '#dc2a55', '#fce6c6', '#e0730a'];

  function add(p) { parts.push(p); start(); }
  function coin(x, y, vx, vy, grav) {
    add({ k: 'coin', x, y, vx, vy, g: grav, f: Math.random() * 8, fs: 10 + Math.random() * 10, life: 6 });
  }
  function spark(x, y) {
    add({ k: 'spark', x, y, vx: (Math.random() - 0.5) * 30, vy: (Math.random() - 0.5) * 30, g: 0, life: 0.5 + Math.random() * 0.6, max: 1.1 });
  }
  function confetti(x, y, vx, vy) {
    add({ k: 'conf', x, y, vx, vy, g: 90, life: 4, c: COLORS[(Math.random() * COLORS.length) | 0], ph: Math.random() * 6 });
  }
  function burst(cx = W / 2, cy = H * 0.55) {
    for (let i = 0; i < 70; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.3;
      const s = 90 + Math.random() * 150;
      coin(cx + (Math.random() - 0.5) * 30, cy, Math.cos(a) * s, Math.sin(a) * s, 260);
    }
    for (let i = 0; i < 60; i++) {
      const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 140;
      confetti(cx, cy, Math.cos(a) * s, Math.sin(a) * s - 60);
    }
    for (let i = 0; i < 24; i++) spark(cx + (Math.random() - 0.5) * 260, cy + (Math.random() - 0.5) * 120);
  }
  function cheer(cx, cy) {
    const green = ['#6dff87', '#2fe35f', '#ffd35e', '#ffffff', '#b8ffc9'];
    for (let i = 0; i < 90; i++) {
      const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 170;
      const p = { k: 'conf', x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 70, g: 95, life: 4,
        c: green[(Math.random() * green.length) | 0], ph: Math.random() * 6 };
      add(p);
    }
    for (let i = 0; i < 30; i++) spark(cx + (Math.random() - 0.5) * 300, cy + (Math.random() - 0.5) * 160);
  }
  function sparkles(cx, cy, w, h, n = 14) {
    for (let i = 0; i < n; i++) spark(cx + (Math.random() - 0.5) * w, cy + (Math.random() - 0.5) * h);
  }
  function rain(ms) { rainUntil = performance.now() + ms; start(); }
  function clear() { parts.length = 0; rainUntil = 0; }

  // scale – rozmiar animacji, box – jej prostokąt na scenie 1920×1080
  function configure(scale, box) {
    px = 4 * scale;
    const w = Math.round(1920 / px), h = Math.round(1080 / px);
    if (cv.width !== w || cv.height !== h) {
      cv.width = W = w;
      cv.height = H = h;
      g.imageSmoothingEnabled = false;
      parts.length = 0;
    }
    area = { x0: box.x0 / px, y0: box.y0 / px, x1: box.x1 / px, y1: box.y1 / px };
  }
  // punkt sceny (px) → jednostki canvasa
  function pt(x, y) { return [x / px, y / px]; }

  function start() {
    if (raf) return;
    last = performance.now();
    raf = requestAnimationFrame(loop);
  }
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (now < rainUntil) {
      rainAcc += dt * 22;
      while (rainAcc >= 1) {
        rainAcc -= 1;
        const rx = area.x0 + Math.random() * (area.x1 - area.x0);
        if (Math.random() < 0.7) coin(rx, area.y0 - 10, (Math.random() - 0.5) * 20, 30 + Math.random() * 50, 50);
        else confetti(rx, area.y0 - 6, (Math.random() - 0.5) * 30, 20 + Math.random() * 30);
      }
    }
    g.clearRect(0, 0, W, H);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      // poza obszarem animacji (z boków i od dołu) cząsteczki gasną
      const out = Math.max(area.x0 - p.x, p.x - area.x1, p.y - area.y1, 0);
      if (p.life <= 0 || p.y > H + 12 || out > 24) { parts.splice(i, 1); continue; }
      g.globalAlpha = 1 - out / 24;
      const x = Math.round(p.x), y = Math.round(p.y);
      if (p.k === 'coin') {
        p.f = (p.f + dt * p.fs) % 8;
        g.drawImage(coinFrames[p.f | 0], x - 4, y - 4);
      } else if (p.k === 'conf') {
        p.ph += dt * 8;
        p.vx *= 0.99;
        g.fillStyle = p.c;
        g.fillRect(x, y, Math.sin(p.ph) > 0 ? 2 : 1, 2);
      } else {
        const s = Math.max(0, Math.round((p.life / p.max) * 3));
        g.fillStyle = s > 1 ? '#fff8e0' : '#ffd35e';
        g.fillRect(x - s, y, s * 2 + 1, 1);
        g.fillRect(x, y - s, 1, s * 2 + 1);
      }
    }
    g.globalAlpha = 1;
    if (parts.length || now < rainUntil) raf = requestAnimationFrame(loop);
    else { raf = null; g.clearRect(0, 0, W, H); }
  }
  return { burst, sparkles, cheer, rain, clear, configure, pt };
})();

// ---------- animacja przebicia progu ----------
function pxOutline(r, extrude, step, halo) {
  const dark = [], light = [];
  for (let dx = -(r + halo); dx <= r + halo; dx += step) {
    for (let dy = -(r + halo); dy <= r + extrude + halo; dy += step) {
      if (!dx && !dy) continue;
      const ey = dy > 0 ? Math.max(0, dy - extrude) : dy;
      const d = Math.max(Math.abs(dx), Math.abs(ey));
      if (d <= r) dark.push(`${dx}px ${dy}px 0 var(--ink)`);
      else if (d <= r + halo) light.push(`${dx}px ${dy}px 0 var(--cream)`);
    }
  }
  return dark.concat(light).join(',');
}
$('aHead').querySelector('.sh').style.textShadow = pxOutline(10, 12, 5, 5);
$('aNum').querySelector('.sh').style.textShadow = pxOutline(12, 14, 6, 6);
$('aUnit').querySelector('.sh').style.textShadow = pxOutline(6, 6, 3, 3);

function setPx(el, text) { el.querySelectorAll('span').forEach((s) => (s.textContent = text)); }
function fitFont(el, basePx, maxWidth) {
  el.style.fontSize = basePx + 'px';
  const w = el.scrollWidth;
  if (w > maxWidth) el.style.fontSize = Math.floor(basePx * (maxWidth / w)) + 'px';
}
function anim(el, frames, opts) { return el.animate(frames, Object.assign({ fill: 'forwards' }, opts)); }
function shake(power, ms) {
  const kf = [];
  for (let i = 0; i < 8; i++) {
    const k = power * (1 - i / 8);
    kf.push({ transform: `translate(${Math.round((Math.random() - 0.5) * 2 * k)}px, ${Math.round((Math.random() - 0.5) * 2 * k)}px)` });
  }
  kf.push({ transform: 'translate(0,0)' });
  $('aShaker').animate(kf, { duration: ms, easing: 'steps(1, end)' });
}
function countUp(el, a, b, ms) {
  return new Promise((res) => {
    const t0 = performance.now();
    let shown = null, lastTick = 0;
    const f = (now) => {
      const p = Math.min(1, (now - t0) / ms);
      const v = Math.round(a + (b - a) * (1 - Math.pow(1 - p, 3)));
      if (v !== shown) {
        setPx(el, WL.fmt(v));
        shown = v;
        if (now - lastTick > 65 && p < 1) { Sfx.tick(p); lastTick = now; }
      }
      if (p < 1) requestAnimationFrame(f); else res();
    };
    requestAnimationFrame(f);
  });
}

const fontsReady = (document.fonts && document.fonts.ready) || Promise.resolve();

// Pozycja i rozmiar animacji: skalujemy cały „ekran” animacji względem wybranego rogu,
// więc przy mniejszym rozmiarze sam przysuwa się do rogu z naturalnym marginesem.
const ALERT_ORIGIN = {
  'center': [0.5, 0.5], 'top-left': [0, 0], 'top-right': [1, 0], 'bottom-left': [0, 1],
  'bottom-right': [1, 1], 'top-center': [0.5, 0], 'bottom-center': [0.5, 1],
};
let alertLayout = { s: 1, ox: 960, oy: 540 };
function layoutAlert(boxId = 'alertBox') {
  const [fx, fy] = ALERT_ORIGIN[cfg.alertPos] || ALERT_ORIGIN.center;
  const s = cfg.alertScale;
  const ox = 1920 * fx, oy = 1080 * fy;
  const box = $(boxId);
  box.style.transformOrigin = `${ox}px ${oy}px`;
  box.style.transform = `scale(${s})`;
  alertLayout = { s, ox, oy };
  FX.configure(s, { x0: ox * (1 - s), y0: oy * (1 - s), x1: ox * (1 - s) + 1920 * s, y1: oy * (1 - s) + 1080 * s });
}
// środek elementu na ekranie → punkt canvasa cząsteczek
function fxAtEl(el) {
  const r = el.getBoundingClientRect();
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  return FX.pt((r.left + r.width / 2) / k, (r.top + r.height / 2) / k);
}
// Logo ma osobną wielkość; jeśli całość przestaje się mieścić w kadrze, zmniejszamy wszystko razem.
function fitAlertContent() {
  $('aLogoWrap').style.width = Math.round(600 * cfg.logoScale) + 'px';
  const fit = $('aFit');
  fit.style.transform = 'none';
  const k = Math.min(1, 1040 / fit.offsetHeight, 1840 / fit.offsetWidth);
  fit.style.transform = k < 1 ? `scale(${k})` : 'none';
}

async function playAlert(tier, from) {
  if (playing) return false;
  playing = true;
  publishStatusSoon();
  try {
    await fontsReady;
    const root = $('alert');
    const els = ['aDim', 'aRays', 'aRaysSpin', 'aFlash', 'aShaker', 'aLogoWrap', 'aLogo', 'aHead', 'aCounter', 'aNum', 'aTag', 'aUl'].map($);
    els.forEach((e) => e.getAnimations().forEach((a) => a.cancel()));
    const [dim, rays, raysSpin, flash, , logoWrap, logo, head, counter, num, tag, ul] = els;

    const fromVal = from != null && from < tier ? from : tier - cfg.step;
    setPx(head, cfg.headline);
    setPx(num, WL.fmt(fromVal));
    setPx($('aUnit'), cfg.unitLabel);
    $('aTagTxt').textContent = cfg.subtitle;
    layoutAlert();
    root.hidden = false;
    fitFont(head, 110, 1700);
    num.style.fontSize = '150px';
    $('aUnit').style.fontSize = '54px';
    const cw = $('aNum').scrollWidth + $('aUnit').scrollWidth + 36;
    if (cw > 1700) {
      const k = 1700 / cw;
      num.style.fontSize = Math.floor(150 * k) + 'px';
      $('aUnit').style.fontSize = Math.floor(54 * k) + 'px';
    }
    tag.style.fontSize = '74px';
    if (tag.offsetWidth > 1700) tag.style.fontSize = Math.floor(74 * 1700 / tag.offsetWidth) + 'px';
    fitAlertContent();

    Sfx.intro();
    anim(dim, [{ opacity: 0 }, { opacity: 1 }], { duration: 400 });
    anim(rays, [{ opacity: 0, transform: 'scale(.2)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 800, easing: 'ease-out' });
    raysSpin.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: 24000, iterations: Infinity });
    flash.animate([{ opacity: 0 }, { opacity: 0.85, offset: 0.25 }, { opacity: 0 }], { duration: 420 });
    anim(logo, [
      { opacity: 1, transform: 'translateY(-700px) scale(.7)' },
      { opacity: 1, transform: 'translateY(24px) scale(1.05)', offset: 0.72 },
      { opacity: 1, transform: 'translateY(0) scale(1)' },
    ], { duration: 620, easing: 'cubic-bezier(.3,.9,.4,1)' });
    await wait(470);
    Sfx.thud();
    shake(14, 260);

    await wait(120);
    anim(head, [
      { opacity: 0, transform: 'scale(3.2)' },
      { opacity: 1, transform: 'scale(.9)', offset: 0.7 },
      { opacity: 1, transform: 'scale(1)' },
    ], { duration: 360, easing: 'steps(7, end)' });
    await wait(260);
    Sfx.slam();
    shake(22, 320);
    FX.sparkles(...fxAtEl(head), 300, 60, 16);

    await wait(260);
    anim(counter, [{ opacity: 0, transform: 'translateY(50px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 260, easing: 'steps(4, end)' });
    await wait(200);
    await countUp(num, fromVal, tier, 1500);

    Sfx.fanfare();
    FX.burst(...fxAtEl(counter));
    shake(26, 420);
    flash.animate([{ opacity: 0 }, { opacity: 0.6, offset: 0.2 }, { opacity: 0 }], { duration: 380 });
    num.animate([{ transform: 'scale(1.3)' }, { transform: 'scale(1)' }], { duration: 420, easing: 'steps(6, end)' });

    await wait(220);
    anim(tag, [
      { opacity: 0, transform: 'rotate(-14deg) scale(.3)' },
      { opacity: 1, transform: 'rotate(1deg) scale(1.08)', offset: 0.7 },
      { opacity: 1, transform: 'rotate(-2deg) scale(1)' },
    ], { duration: 520, easing: 'cubic-bezier(.3,1.4,.5,1)' });
    anim(ul, [{ strokeDashoffset: 1000 }, { strokeDashoffset: 0 }], { duration: 450, delay: 420, easing: 'ease-out' });
    logoWrap.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-10px)' }, { transform: 'translateY(0)' }],
      { duration: 1200, iterations: Infinity, easing: 'steps(4, end)' });
    FX.rain(3600);

    await wait(4600);
    Sfx.exit();
    [logo, head, counter, tag].forEach((el, i) => {
      anim(el, [
        { transform: getComputedStyle(el).transform === 'none' ? 'none' : getComputedStyle(el).transform, opacity: 1 },
        { transform: 'translateY(90px) scale(.85)', opacity: 0 },
      ], { duration: 420, delay: i * 70, easing: 'steps(5, end)' });
    });
    anim(dim, [{ opacity: 1 }, { opacity: 0 }], { duration: 750, delay: 150 });
    anim(rays, [{ opacity: 1 }, { opacity: 0 }], { duration: 600 });
    await wait(950);
    root.hidden = true;
    els.forEach((e) => e.getAnimations().forEach((a) => a.cancel()));
  } catch (e) {
    console.error(e);
    $('alert').hidden = true;
  } finally {
    playing = false;
    renderWidget();
    publishStatusSoon();
  }
  return true;
}

// ---------- animacja zdobycia celu ----------
async function playGoalAlert(goal) {
  if (playing) return false;
  playing = true;
  publishStatusSoon();
  try {
    await fontsReady;
    const root = $('goalAlert');
    const els = ['gDim', 'gCard', 'gCheck', 'gStamp', 'gFlash', 'gShaker', 'gLine'].map($);
    els.forEach((e) => e.getAnimations().forEach((a) => a.cancel()));
    const [dim, card, check, stamp, flash, shaker, line] = els;
    const tick = check.querySelector('path');
    tick.getAnimations().forEach((a) => a.cancel());

    $('gLabel').textContent = cfg.goalAlertLabel;

    $('gNum').style.fontSize = '72px';
    if ($('gNum').scrollWidth > 1020) $('gNum').style.fontSize = Math.floor(72 * 1020 / $('gNum').scrollWidth) + 'px';

    for (let size = 40; size >= 20; size -= 2) {
      desc.style.fontSize = size + 'px';
      if (desc.scrollHeight <= Math.round(size * 1.35 * 2) + 2) break;
    }

    Sfx.ding();
    anim(dim, [{ opacity: 0 }, { opacity: 1 }], { duration: 380 });
    anim(card, [
      { opacity: 0, transform: 'translateY(140px) scale(.92)' },
      { opacity: 1, transform: 'translateY(-10px) scale(1.03)', offset: 0.65 },
      { opacity: 1, transform: 'translateY(0) scale(1)' },
    ], { duration: 560, easing: 'cubic-bezier(.2,.9,.3,1.2)' });

    await wait(420);
    anim(tick, [{ strokeDashoffset: 300 }, { strokeDashoffset: 0 }], { duration: 420, easing: 'cubic-bezier(.4,0,.2,1)' });
    anim(check, [{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { duration: 520 });

    await wait(480);
    Sfx.stamp();
    anim(stamp, [
      { opacity: 0, transform: 'rotate(-34deg) scale(2.6)' },
      { opacity: 1, transform: 'rotate(-11deg) scale(.94)', offset: 0.7 },
      { opacity: 1, transform: 'rotate(-14deg) scale(1)' },
    ], { duration: 260, easing: 'steps(6, end)' });
    flash.animate([{ opacity: 0 }, { opacity: 0.75, offset: 0.2 }, { opacity: 0 }], { duration: 420 });
    const kf = [];
    for (let i = 0; i < 8; i++) {
      const k = 22 * (1 - i / 8);
      kf.push({ transform: `translate(${Math.round((Math.random() - 0.5) * 2 * k)}px, ${Math.round((Math.random() - 0.5) * 2 * k)}px)` });
    }
    kf.push({ transform: 'translate(0,0)' });
    shaker.animate(kf, { duration: 360, easing: 'steps(1, end)' });
    Sfx.goalDone();
    FX.cheer(...fxAtEl(card));

    await wait(260);
    anim(line, [{ width: '0%' }, { width: '100%' }], { duration: 520, easing: 'cubic-bezier(.3,0,.2,1)' });
    FX.sparkles(...fxAtEl(check), 120, 120, 12);

    await wait(4600);
    Sfx.exit();
    anim(card, [{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(120px)', opacity: 0 }],
      { duration: 460, easing: 'cubic-bezier(.4,0,.8,.4)' });
    anim(dim, [{ opacity: 1 }, { opacity: 0 }], { duration: 640, delay: 120 });
    await wait(820);
    root.hidden = true;
    els.forEach((e) => e.getAnimations().forEach((a) => a.cancel()));
  } catch (e) {
    console.error(e);
    $('goalAlert').hidden = true;
  } finally {
    playing = false;
    renderWidget();
    publishStatusSoon();
  }
  return true;
}

// ---------- komunikacja ----------
let bus = null;
let statusTimer = null;
let lastStatusAt = 0;
const STATUS_MIN_GAP = 45000;
function statusPayload() {
  const g = gate();
  return {
    t: 'status', v: VERSION, cfg, cfgTime,
    st: {
      raw: S.raw, total: total(), countTime: S.rawTime, today: S.today, yesterday: S.yesterday,
      lastCelebrated: S.lastCelebrated, pending: S.pending, lastPlayed: S.lastPlayed,
      goalsDone: S.goalsDone.length, pendingGoals: S.pendingGoals.map((g) => g.n),
      playing, inOBS, streamKnown, streaming, streamStartedAt: S.streamStartedAt,
      gate: { ok: g.ok, code: g.code, text: g.text, readyAt: g.readyAt || null },
      preview: P.preview,
    },
  };
}
function publishStatusSoon(delay = 1200, force = false) {
  if (!bus) return;
  const wait = force ? delay : Math.max(delay, STATUS_MIN_GAP - (Date.now() - lastStatusAt));
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => {
    lastStatusAt = Date.now();
    bus.publish(statusPayload()).catch((e) => console.warn('status', e));
  }, wait);
}

function onMessage(m, meta) {
  switch (m.t) {
    case 'count': {
      if (meta.time < S.rawTime || typeof m.raw !== 'number') return;
      const changed = m.raw !== S.raw || JSON.stringify(m.today) !== JSON.stringify(S.today);
      S.raw = m.raw;
      S.rawTime = meta.time;
      S.today = m.today || null;
      S.yesterday = m.yesterday || null;
      saveState();
      evaluate();
      renderWidget();
      if (changed) publishStatusSoon();
      break;
    }
    case 'config': {
      if (meta.time <= cfgTime) return;
      const old = cfg;
      cfg = WL.normalizeConfig(m.cfg);
      cfgTime = meta.time;
      saveCfg();
      if (old.step !== cfg.step || old.offset !== cfg.offset) rebaseline();
      evaluate();
      evaluateGoals(true);   // cele dopisane w panelu, już osiągnięte, nie odpalają animacji
      renderWidget();
      publishStatusSoon();
      break;
    }
    case 'cmd':
      onCommand(m);
      break;
  }
}

function onCommand(m) {
  const t = total();
  switch (m.cmd) {
    case 'ping':
      publishStatusSoon(300, true);
      break;
    case 'test': {
      const tier = Number(m.tier) || (t != null ? WL.tierOf(t, cfg.step) + cfg.step : cfg.step * 10);
      Sfx.ensure();
      playAlert(tier, tier - cfg.step);
      break;
    }
    case 'test-goal': {
      const goals = cfg.goals || [];
      const g = (m.goal && m.goal.n) ? m.goal
        : goals.find((x) => t == null || x.n > t) || goals[0] || { n: 5000, text: 'przykładowy cel' };
      Sfx.ensure();
      playGoalAlert(g);
      break;
    }
    case 'replay':
      if (S.lastPlayed) playAlert(S.lastPlayed.tier, S.lastPlayed.from);
      break;
    case 'play-pending':
      playPending();
      break;
    case 'clear-pending':
      // pomijamy wszystko, co czeka: próg i cele
      if (S.pending != null) S.lastCelebrated = Math.max(S.lastCelebrated ?? S.pending, S.pending);
      S.pending = null;
      S.pendingFrom = null;
      for (const g of S.pendingGoals) if (!S.goalsDone.includes(g.n)) S.goalsDone.push(g.n);
      S.pendingGoals = [];
      saveState();
      publishStatusSoon(300, true);
      break;
    case 'reset':
      S.lastCelebrated = t != null ? WL.tierOf(t, cfg.step) : null;
      S.pending = null;
      S.pendingFrom = null;
      for (const g of cfg.goals || []) if (t != null && t >= g.n && !S.goalsDone.includes(g.n)) S.goalsDone.push(g.n);
      S.pendingGoals = [];
      saveState();
      publishStatusSoon(300, true);
      break;
    case 'reload':
      // z parametrem, żeby OBS pobrał stronę od nowa zamiast z pamięci podręcznej
      location.replace(location.pathname + '?cb=' + Date.now() + location.hash);
      break;
  }
}

function renderInfo() {
  const el = $('info');
  if (!P.topic) {
    el.hidden = false;
    el.textContent = 'Brak tematu ntfy w adresie.\nDodaj na końcu URL: #topic=twoj-temat (skopiuj link z panelu).';
    return;
  }
  if (!P.debug) { el.hidden = true; return; }
  el.hidden = false;
  const g = gate();
  const up = S.streamStartedAt ? Math.floor((Date.now() - S.streamStartedAt) / 60000) + ' min' : '—';
  el.textContent = [
    `overlay v${VERSION}  ntfy: ${bus && bus.connected ? 'połączono' : 'łączę…'}  OBS: ${inOBS ? 'tak' : 'nie'}`,
    `wishlisty: ${WL.fmt(total())} (steam ${WL.fmt(S.raw)} + korekta ${cfg.offset})  dziś: ${S.today ? S.today.adds : '—'}`,
    `próg co ${cfg.step}  ostatnio świętowany: ${WL.fmt(S.lastCelebrated)}  w kolejce: ${WL.fmt(S.pending)}`,
    `stream: ${streamKnown ? (streaming ? 'LIVE ' + up : 'offline') : 'nieznany'}  bramka: ${g.text}`,
  ].join('\n');
}

// podgląd w zwykłej przeglądarce: dźwięk wymaga kliknięcia
if (!inOBS) {
  const b = $('soundBtn');
  b.hidden = false;
  b.onclick = () => { Sfx.ensure(); b.hidden = true; };
}

// podgląd stylu bez ruszania streama: ?style=neon&fake=1
if (P.style) cfg = WL.normalizeConfig(Object.assign({}, cfg, { widgetStyle: P.style }));
if (P.fake) {
  S.raw = 2323;
  S.rawTime = Date.now();
  S.yesterday = { date: '2026-09-19', adds: 1054 };
  S.lastCelebrated = 2250;
  cfg = WL.normalizeConfig(Object.assign({}, cfg, {
    step: 250, showBar: true, showToday: true, barSeconds: 6, goalSeconds: 4,
    widgetPos: 'top-center', widgetX: 0, widgetY: 0, widgetScale: 1,
    goals: cfg.goals && cfg.goals.length ? cfg.goals : [
      { n: 5000, text: 'Stream z układania lego' },
      { n: 15000, text: 'Odcinek na youtube w stylu Książula i test żarcia z IKEI' },
    ],
  }));
}

if (P.topic && !P.fake) {
  bus = new WL.Bus({
    servers: [P.server, P.server2 !== 'off' ? P.server2 : null],
    topic: P.topic, token: P.token, onMessage, onState: () => renderInfo(),
  });
  bus.connect();
  publishStatusSoon(3000);
}
renderWidget();
renderInfo();
setInterval(tick, 2000);
</script>
